# .github/workflows/encode.yml
# AV1 视频压缩 — Phase 2: 并行编码
# 轮询等待：compress 串行（FIFO），不取消任何 run
# prepare & finalize 自由并行，不被 compress 阻塞
name: AV1 Encode

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram chat ID"
        required: true
      message_id:
        description: "Telegram message ID"
        required: true
      caption:
        description: "Original caption"
        required: false
        default: ""
      gen_thumbnail:
        description: "Generate thumbnail (1/0)"
        required: false
        default: "0"
      prepare_run_id:
        description: "Run ID of prepare workflow (for artifact download)"
        required: true
      segments:
        description: "JSON array of segment indices"
        required: true

permissions:
  contents: read
  actions: write

jobs:
  # ── 等待轮次：FIFO 排队，不取消任何 run ──
  wait-for-slot:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for older encode runs to finish
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            while (true) {
              const resp = await github.rest.actions.listWorkflowRuns({
                owner, repo,
                workflow_id: 'encode.yml',
                status: 'in_progress',
                per_page: 100
              });

              // 只等比自己先到的（run ID 更小），后到的不影响
              const older = resp.data.workflow_runs.filter(r => r.id < context.runId);

              if (older.length === 0) {
                core.info('No older encode running, proceeding!');
                break;
              }

              const ids = older.map(r => r.id).join(', ');
              core.info(`Waiting for older encode run(s): ${ids}`);
              await sleep(30000); // 30s 轮询
            }

  # ── Phase 2: 并行编码 ──
  compress:
    needs: wait-for-slot
    runs-on: ubuntu-latest
    strategy:
      matrix:
        segment: ${{ fromJSON(inputs.segments) }}
      max-parallel: 35
      fail-fast: false
    steps:
      - name: Install ffmpeg
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
          echo "/tmp/ffmpeg-master-latest-linux64-gpl/bin" >> $GITHUB_PATH

      - name: Download segments (from prepare run)
        uses: actions/download-artifact@v4
        with:
          name: segments
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Encode
        run: |
          SEG_FILE=$(printf "seg_%03d.mp4" ${{ matrix.segment }})
          OUT_FILE=$(printf "seg_%03d_enc.mp4" ${{ matrix.segment }})

          ffmpeg -y -i "$SEG_FILE" \
            -c:v libsvtav1 -preset 2 -crf 36 -pix_fmt yuv420p \
            -vf "scale=1280:720,setsar=1" \
            -c:a libopus -b:a 96k \
            -map_metadata -1 \
            "$OUT_FILE"

          rm -f "$SEG_FILE"

      - name: Upload encoded segment
        uses: actions/upload-artifact@v4
        with:
          name: encoded-${{ matrix.segment }}
          path: seg_*_enc.mp4
          retention-days: 1

  trigger-finalize:
    needs: compress
    runs-on: ubuntu-latest
    steps:
      - name: Trigger finalize workflow
        env:
          CHAT_ID: ${{ inputs.chat_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
          CAPTION: ${{ inputs.caption }}
          GEN_THUMBNAIL: ${{ inputs.gen_thumbnail }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        uses: actions/github-script@v7
        with:
          script: |
            // encode run ID = current run, finalize needs it to download encoded-* artifacts
            const r = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'finalize.yml',
              ref: 'main',
              inputs: {
                chat_id: process.env.CHAT_ID,
                message_id: process.env.MESSAGE_ID,
                caption: process.env.CAPTION,
                gen_thumbnail: process.env.GEN_THUMBNAIL,
                prepare_run_id: process.env.PREPARE_RUN_ID,
                encode_run_id: String(context.runId)
              }
            });
            core.info(`Triggered finalize.yml (encode run ${context.runId})`);
