# .github/workflows/encode.yml
# AV1 视频压缩 — Phase 2: 并行编码
# 串行化：同一时刻只有一个视频在编码
# compress 完成后立即触发 finalize.yml 并释放锁
# → 下一个视频的 compress 可以跟当前视频的 finalize 并行
name: AV1 Encode

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram chat ID"
        required: true
      message_id:
        description: "Telegram message ID"
        required: true
      caption:
        description: "Original caption"
        required: false
        default: ""
      gen_thumbnail:
        description: "Generate thumbnail (1/0)"
        required: false
        default: "0"
      prepare_run_id:
        description: "Run ID of prepare workflow (for artifact download)"
        required: true
      segments:
        description: "JSON array of segment indices"
        required: true

permissions:
  contents: read
  actions: write

# 只串行化 compress：A 的 compress 完成后释放锁
# B 的 compress 立即开始，跟 A 的 finalize 并行（1+35=36 < 40）
concurrency:
  group: av1-encode
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        segment: ${{ fromJSON(inputs.segments) }}
      max-parallel: 40
      fail-fast: false
    steps:
      - name: Install ffmpeg
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
          echo "/tmp/ffmpeg-master-latest-linux64-gpl/bin" >> $GITHUB_PATH

      - name: Download segments (from prepare run)
        uses: actions/download-artifact@v4
        with:
          name: segments
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Encode
        run: |
          SEG_FILE=$(printf "seg_%03d.mp4" ${{ matrix.segment }})
          OUT_FILE=$(printf "seg_%03d_enc.mp4" ${{ matrix.segment }})

          ffmpeg -y -i "$SEG_FILE" \
            -c:v libsvtav1 -preset 2 -crf 36 -pix_fmt yuv420p \
            -vf "scale=1280:720,setsar=1" \
            -c:a libopus -b:a 96k \
            -map_metadata -1 \
            "$OUT_FILE"

          rm -f "$SEG_FILE"

      - name: Upload encoded segment
        uses: actions/upload-artifact@v4
        with:
          name: encoded-${{ matrix.segment }}
          path: seg_*_enc.mp4
          retention-days: 1

  trigger-finalize:
    needs: compress
    runs-on: ubuntu-latest
    steps:
      - name: Trigger finalize workflow
        env:
          CHAT_ID: ${{ inputs.chat_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
          CAPTION: ${{ inputs.caption }}
          GEN_THUMBNAIL: ${{ inputs.gen_thumbnail }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        uses: actions/github-script@v7
        with:
          script: |
            // encode run ID = current run, finalize needs it to download encoded-* artifacts
            const r = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'finalize.yml',
              ref: 'main',
              inputs: {
                chat_id: process.env.CHAT_ID,
                message_id: process.env.MESSAGE_ID,
                caption: process.env.CAPTION,
                gen_thumbnail: process.env.GEN_THUMBNAIL,
                prepare_run_id: process.env.PREPARE_RUN_ID,
                encode_run_id: String(context.runId)
              }
            });
            core.info(`Triggered finalize.yml (encode run ${context.runId})`);
