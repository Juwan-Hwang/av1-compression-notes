# .github/workflows/compress.yml
# AV1 视频压缩 — Phase 1: 下载 + 切分
# 无并发限制：prepare 自由并行，结束后触发 encode.yml
name: AV1 Prepare

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram chat ID"
        required: true
      message_id:
        description: "Telegram message ID"
        required: true
      caption:
        description: "Original caption (#tags etc) to preserve"
        required: false
        default: ""
      gen_thumbnail:
        description: "Generate thumbnail (1/0)"
        required: false
        default: "0"

permissions:
  contents: read
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      segments: ${{ steps.split.outputs.segments }}
      count: ${{ steps.split.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r bot/requirements.txt

      - name: Install ffmpeg
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C /tmp
          echo "/tmp/ffmpeg-master-latest-linux64-gpl/bin" >> $GITHUB_PATH

      - name: Download & split
        id: split
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
        run: python bot/prepare.py

      - name: Upload segments
        uses: actions/upload-artifact@v4
        with:
          name: segments
          path: segments/
          retention-days: 1

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: metadata
          path: segments.json
          retention-days: 1

      - name: Trigger encode workflow
        env:
          CHAT_ID: ${{ inputs.chat_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
          CAPTION: ${{ inputs.caption }}
          GEN_THUMBNAIL: ${{ inputs.gen_thumbnail }}
          SEGMENTS: ${{ steps.split.outputs.segments }}
        uses: actions/github-script@v7
        with:
          script: |
            const r = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'encode.yml',
              ref: 'main',
              inputs: {
                chat_id: process.env.CHAT_ID,
                message_id: process.env.MESSAGE_ID,
                caption: process.env.CAPTION,
                gen_thumbnail: process.env.GEN_THUMBNAIL,
                prepare_run_id: String(context.runId),
                segments: process.env.SEGMENTS
              }
            });
            core.info(`Triggered encode.yml (prepare run ${context.runId})`);
